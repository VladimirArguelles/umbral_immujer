<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UMBRAL - IMMUJER">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UMBRAL - IMMUJER">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">

  <title>UMBRAL - IMMUJER</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0D0714;
    }
    #boot-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0D0714;
      z-index: 99999;
      transition: opacity 0.5s ease-out;
    }
    #boot-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .boot-logo {
      max-width: 340px;
      width: 75%;
      height: auto;
      animation: bootPulse 2s ease-in-out infinite alternate;
    }
    @keyframes bootPulse {
      0% {
        opacity: 0.85;
        transform: scale(0.97);
      }
      100% {
        opacity: 1;
        transform: scale(1.03);
      }
    }
  </style>
</head>
<body>
  <div id="boot-container">
    <img src="logo-umbral-boot.png" alt="UMBRAL - IMMUJER" class="boot-logo">
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot-container');
      if (boot) {
        boot.classList.add('fade-out');
        setTimeout(function() {
          if (boot.parentNode) {
            boot.parentNode.removeChild(boot);
          }
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
