name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: 4. Ensure Gradlew is Executable
        run: chmod +x android/gradlew

      - name: 5. Prepare Environment Configuration (.env)
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            printf '%s\n' "$ENV_FILE_CONTENT" > .env
          elif [ -n "$SECRET_SUPABASE_ANON_KEY" ]; then
            FINAL_URL="${SECRET_SUPABASE_URL:-https://kkgacvhbcxgoxjpnkxmw.supabase.co}"
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$FINAL_URL" "$SECRET_SUPABASE_ANON_KEY" > .env
          else
            echo "::error::No se encontraron secretos SUPABASE_ANON_KEY ni ENV_FILE en GitHub Actions. Evitando usar .env.example."
            exit 1
          fi

      - name: 5b. Configure Persistent Android Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            RESOLVED_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 está presente pero faltan KEYSTORE_PASSWORD o KEY_ALIAS en GitHub Secrets."
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/release-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=app/release-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$RESOLVED_KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            keytool -list -keystore android/app/release-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "Keystore oficial configurado correctamente para firma Release."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 no está configurado en GitHub Secrets; el APK usará firma debug temporal (puede causar 'No se instaló la app' en actualizaciones OTA)."
          fi

      - name: 6. Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: 7. Install Dependencies
        run: flutter pub get

      - name: 8. Build Release APK
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi
          FINAL_URL="${SECRET_SUPABASE_URL:-${SUPABASE_URL:-https://kkgacvhbcxgoxjpnkxmw.supabase.co}}"
          FINAL_KEY="${SECRET_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}}"
          if [ -z "$FINAL_KEY" ] || [ "$FINAL_KEY" = "your-anon-key-here" ]; then
            echo "::error::SUPABASE_ANON_KEY inválido o ausente en los secretos de GitHub."
            exit 1
          fi
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$FINAL_URL" \
            --dart-define=SUPABASE_ANON_KEY="$FINAL_KEY"

      - name: 9. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: 10. Publish or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Versión Oficial UMBRAL"
          body: "Compilación automática del APK de UMBRAL con las últimas correcciones."
          draft: false
          prerelease: false
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 11. Clean Up Sensitive Build Files
        if: always()
        run: rm -f .env android/key.properties android/app/release-keystore.jks
